# PT AI Log Mining Pipeline – Configuration
# Copy to config.local.yaml and override values; local is gitignored.

pipeline:
  drop_folder: "./logs_drop"          # File watcher monitors this folder
  output_folder: "./output"           # Reports written here
  db_path: "/tmp/pt_pipeline.duckdb"  # DuckDB data store (use /tmp to avoid network-FS locking)

openai:
  api_key: ""                         # Set via env var OPENAI_API_KEY (preferred)
  model: "gpt-4o"                     # OpenAI: gpt-4o | Groq: llama-3.3-70b-versatile | Gemini: gemini-2.0-flash
  base_url: ""                        # Leave blank for OpenAI. Groq: https://api.groq.com/openai/v1
  max_tokens: 4096

sla:
  # ── Verdict gate (LR-based pass/fail) ────────────────────────────────────────
  avg_response_time_sla_sec: 1.0     # PASS requires avg response time < this value (seconds)
  expected_tps: 30                    # PASS requires achieved TPS >= this value (0 = not enforced)

  # ── Threshold Agent rules ─────────────────────────────────────────────────────
  p90_latency_ms: 2000               # p90 response time SLA (primary for LR transactions)
  p95_latency_ms: 2000               # p95 response time SLA
  error_rate_pct: 1.0                # max allowed error rate %
  tps_drop_pct: 20.0                 # alert if TPS drops >20% vs baseline
  cpu_pct: 85.0                      # CPU % alert threshold
  memory_pct: 90.0                   # Memory % alert threshold
  disk_queue_length: 2.0             # Disk queue length threshold

anomaly:
  z_score_threshold: 3.0
  isolation_forest_contamination: 0.05
  window_size: 60                    # seconds for rolling window aggregations

test_phases:
  # Default phase boundaries (overridden by LoadRunner metadata if available)
  ramp_up_minutes: 5
  steady_state_minutes: 20
  ramp_down_minutes: 5

report:
  company_name: "Performance Engineering"
  logo_path: ""                      # Optional path to logo PNG

sql_sla:
  # SQL Server thresholds used by Threshold Agent
  min_buffer_cache_hit_pct: 95.0     # Buffer cache hit ratio must stay above this
  min_page_life_expectancy_s: 300    # PLE must stay above 300s (5 minutes)
  max_deadlocks_sec: 0.1             # Deadlocks per second alert
  max_lock_waits_sec: 5.0            # Lock waits per second alert
  max_processes_blocked: 5           # Blocked processes alert
  max_recompilations_sec: 10.0       # SQL re-compilations per second alert
